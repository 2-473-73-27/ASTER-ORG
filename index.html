<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraSMS - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: 20px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .logo-text span:first-child {
            color: #2563eb; /* Astra Blue */
        }

        .logo-text span:last-child {
            color: #1f2937; /* SMS Dark */
        }

        .welcome-back {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.2s;
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .security-row {
            display: flex;
            gap: 10px;
        }

        .security-row input {
            flex: 1;
            background-color: #f8fafc;
        }

        .answer-btn {
            padding: 0 16px;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #6b7280;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .answer-btn:hover {
            background-color: #f3f4f6;
        }

        .sign-in-btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .sign-in-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="logo-text"><span>Astra</span><span>SMS</span></h1>
        <div class="welcome-back">Welcome back!</div>
        <div class="subtitle">Please sign in to continue.</div>

        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Your password" required>
            </div>

            <div class="form-group">
                <label for="security">Security check</label>
                <div class="security-row">
                    <input type="text" id="security" class="form-control" value="What is 7 + 9 = ?" readonly>
                    <button type="button" class="answer-btn">Answer</button>
                </div>
            </div>

            <button type="submit" class="sign-in-btn">Sign In</button>
        </form>
    </div>

</body>
</html>
